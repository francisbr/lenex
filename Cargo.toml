[workspace]
resolver = "3"
members = [".", "lenex-py", "lenex-js"]
default-members = ["."]

[package]
name = "lenex"
version = "0.1.0"
edition = "2024"
description = "Parse and generate lenex documents."
license = "MIT"
repository = "https://github.com/francisbr/lenex"

[dependencies]
bon = { version = "3.10", default-features = false }
quick-xml = { version = "0.42", default-features = false, features = ["serialize"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
time = { version = "0.3", default-features = false, features = ["macros", "serde-well-known"] }
thiserror = { version = "2.0", default-features = false, features = ["std"] }

